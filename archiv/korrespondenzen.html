<p><a class="back-link" href="{{ site.baseurl }}/archiv/">&larr; Zurück zur Archivübersicht</a></p>

<h2>Korrespondenzen durchsuchen</h2>
<p>Dieses Spezialfindmittel führt Korrespondenzdaten aus der Korrespondenzüberlieferung und der Autographensammlung zusammen.</p>

<section class="correspondence-search" data-correspondence-search data-data-url="{{ site.baseurl }}/assets/data/archiv/correspondence-data.json" data-tree-url="{{ site.baseurl }}/archiv/archivbaum/">
    <form class="correspondence-search-panel" data-correspondence-form>
        <div class="correspondence-search-controls">
            <label>
                Absender
                <input type="search" data-field="sender" autocomplete="off">
            </label>
            <label>
                Empfänger
                <input type="search" data-field="recipient" autocomplete="off">
            </label>
            <label>
                Von
                <input type="search" data-field="from" inputmode="numeric" placeholder="1896 oder 23.11.1896">
            </label>
            <label>
                Bis
                <input type="search" data-field="to" inputmode="numeric" placeholder="1896-11">
            </label>
            <label class="correspondence-wide-field">
                Volltext
                <input type="search" data-field="text" autocomplete="off">
            </label>
            <label>
                Ort
                <input type="search" data-field="place" autocomplete="off">
            </label>
            <label>
                Kategorie
                <select data-field="category">
                    <option value="">Alle Kategorien</option>
                </select>
            </label>
            <div class="correspondence-actions">
                <button type="submit" class="button-link">Suchen</button>
                <button type="button" class="button-link-secondary" data-correspondence-reset>Zurücksetzen</button>
            </div>
        </div>
        <p class="search-meta" data-correspondence-status>Korrespondenzdaten werden geladen ...</p>
    </form>
    <div class="correspondence-results" data-correspondence-results aria-live="polite"></div>
</section>

<script src="{{ site.baseurl }}/assets/js/correspondence-search.js" defer></script>
