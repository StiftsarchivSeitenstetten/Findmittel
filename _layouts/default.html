<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitale Findmittel – Stiftsarchiv & Stiftsbibliothek Seitenstetten</title>
    <!-- Hier greifen alle Seiten, egal wie tief im Ordner, auf das Haupt-CSS zu -->
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
    {% if page.extra_css %}
        {% for stylesheet in page.extra_css %}
    <link rel="stylesheet" href="{{ site.baseurl }}{{ stylesheet }}">
        {% endfor %}
    {% endif %}
    {% if page.datatables %}
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    {% endif %}
</head>
<body>
    <header>
        {% include header.html %}
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        {% include footer.html %}
    </footer>

    {% if page.extra_js %}
        {% for script in page.extra_js %}
    <script src="{{ site.baseurl }}{{ script }}" defer></script>
        {% endfor %}
    {% endif %}
</body>
</html>
